name: 'Auto pull translation'
description: 'Get last translation on Phrase and create a pull request'
inputs:
  path-to-phrase-yml:
    description: 'Path to .phrase.yml in repository'
    default: './'
  reviewers:
    description: 'List of reviewers to add to the pull request, comma-separated list (no spaces)'
    default: ''

runs:
  using: "composite"
  steps:
    - name: Deprecated version of FinalCAD/auto-pull-translation
      shell: bash
      run: |
        echo '::error title=Deprecated version of FinalCAD/auto-pull-translation::This version of FinalCAD/auto-pull-translation is deprecated use `v2` instead.'
        exit 1

branding:
  icon: 'align-justify'
  color: 'blue'
